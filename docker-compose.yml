
services:
  db:
    image: timescale/timescaledb:2.13.0-pg15
    container_name: pmd-db
    environment:
      POSTGRES_DB: pingmedaddy
      POSTGRES_USER: pingmedaddy
      POSTGRES_PASSWORD: pingmedaddy
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/timescale_init.sql:/docker-entrypoint-initdb.d/timescale_init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pingmedaddy"]
      interval: 5s
      timeout: 5s
      retries: 6
    networks:
      - pmd-network
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        - APP_VERSION=${APP_VERSION:-0.0.0}
    container_name: pmd-api
    environment:
      - APP_SLUG=${APP_SLUG:-pmd}
      - APP_NAME=${APP_NAME:-PingMeDaddy}
      - APP_DESCRIPTION=${APP_DESCRIPTION:-Network monitoring}
      - APP_HOST=${APP_HOST:-}
      - API_PORT=${API_PORT:-6666}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - HUB_HOST=${HUB_HOST:-}
      - HUB_API_PORT=${HUB_API_PORT:-8000}
      - HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT:-80}
      - IS_SHARED=${IS_SHARED:-false}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql+asyncpg://pingmedaddy:pingmedaddy@pmd-db:5432/pingmedaddy
      - UPLOADS_DIR=/app/uploads
    volumes:
      - uploads-data:/app/uploads
      - storage-data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-6666}:${API_PORT:-6666}"
    networks:
      - pmd-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${API_PORT:-6666}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_PORT=${API_PORT:-6666}
        - VITE_HUB_API_PORT=${HUB_API_PORT:-8000}
        - VITE_HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT:-80}
        - VITE_APP_SLUG=${APP_SLUG:-pmd}
    container_name: pmd-frontend
    environment:
      - APP_SLUG=${APP_SLUG:-pmd}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - HUB_HOST=${HUB_HOST:-}
      - HUB_API_PORT=${HUB_API_PORT:-8000}
      - APP_HOST=${APP_HOST:-}
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - pmd-network
    restart: unless-stopped

networks:
  pmd-network:
    driver: bridge

volumes:
  db-data:
  uploads-data:
  storage-data:
